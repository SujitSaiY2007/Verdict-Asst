[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verdict-dev"
version = "0.1.0"
description = "A free-first, local-first AI developer companion for CLI and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "pydantic-ai-slim[openai]>=1.0,<2",
  "mcp>=1.28,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
verdict = "verdict.cli:main"

[tool.setuptools.packages.find]
include = ["verdict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
